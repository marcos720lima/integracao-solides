<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Gestão de Identidade e Acesso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('painel.static', filename='style.css') }}">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <img src="{{ url_for('painel.static', filename='img/logo_unimed.png') }}" alt="Unimed Oeste do Pará" class="logo-unimed">
      <div class="titulo">Gestão de Identidade e Acesso</div>
      <div class="subtitulo">Entre com seu usuário do Active Directory (acesso restrito à TI)</div>

      {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
          {% for categoria, mensagem in mensagens %}
            <div class="aviso aviso-erro">{{ mensagem }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="campo">
          <label for="login">Usuário</label>
          <input type="text" id="login" name="login" autocomplete="username" autofocus required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primario">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
