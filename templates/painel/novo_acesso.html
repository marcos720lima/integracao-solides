{% extends "base.html" %}
{% block titulo %}Novo acesso{% endblock %}

{% block conteudo %}
<div class="page-header">
  <h1>Criar acesso de novo colaborador</h1>
  <p>Busca os dados no Tangerino pelo CPF e cria o usuário no Active Directory e no Google Workspace ao mesmo tempo.</p>
</div>

<div class="card-panel">
  <form method="POST" id="form-novo-acesso">
    <div class="form-grid">
      <div class="campo">
        <label for="cpf">CPF do colaborador</label>
        <input type="text" id="cpf" name="cpf" value="{{ form.cpf if form else '' }}" placeholder="Somente números" required>
      </div>
      <div class="campo" style="justify-content:flex-end;">
        <button type="button" class="btn btn-primario" id="btn-buscar-cpf" style="width:fit-content;">Buscar no Tangerino</button>
      </div>

      <div class="campo">
        <label for="matricula">Matrícula</label>
        <input type="text" id="matricula" readonly style="background:var(--surface-subtle);">
      </div>
      <div class="campo">
        <label for="data_nascimento">Data de nascimento</label>
        <input type="text" id="data_nascimento" name="data_nascimento" value="{{ form.data_nascimento if form else '' }}">
      </div>

      <div class="campo full">
        <label for="nome_completo">Nome completo</label>
        <input type="text" id="nome_completo" name="nome_completo" value="{{ form.nome_completo if form else '' }}" required>
      </div>

      <div class="campo">
        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" name="telefone" value="{{ form.telefone if form else '' }}">
      </div>
      <div class="campo">
        <label for="email_pessoal">Email pessoal (Tangerino, só referência)</label>
        <input type="text" id="email_pessoal" readonly style="background:var(--surface-subtle);">
      </div>

      <div class="campo">
        <label for="setor">Setor <span style="font-weight:400; color:var(--text-muted);">(descrição no AD / departamento no Google)</span></label>
        <input type="text" id="setor" name="setor" value="{{ form.setor if form else '' }}" required>
        <div id="setor-original" style="font-size:11.5px; color:var(--text-muted); margin-top:4px; display:none;"></div>
      </div>
      <div class="campo">
        <label for="cargo">Cargo <span style="font-weight:400; color:var(--text-muted);">(cargo no Google)</span></label>
        <input type="text" id="cargo" name="cargo" value="{{ form.cargo if form else '' }}">
        <div id="cargo-original" style="font-size:11.5px; color:var(--text-muted); margin-top:4px; display:none;"></div>
      </div>

      <div class="campo">
        <label for="username">Nome de usuário (login no AD)</label>
        <input type="text" id="username" name="username" value="{{ form.username if form else '' }}" required>
      </div>
      <div class="campo">
        <label for="email">Email corporativo <span style="font-weight:400; color:var(--text-muted);">(AD + Google)</span></label>
        <input type="text" id="email" name="email" value="{{ form.email if form else '' }}" required>
      </div>

      <div class="campo">
        <label for="ou_ad">OU do AD</label>
        <select id="ou_ad" name="ou_ad">
          <option value="">Usar padrão (AD_OU_NOVOS_USUARIOS)</option>
          {% for ou in ous_ad %}
          <option value="{{ ou.dn }}" {{ 'selected' if form and form.ou_ad == ou.dn }}>{{ ou.nome }} — {{ ou.dn }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="campo">
        <label for="ou_google">OU do Google</label>
        <select id="ou_google" name="ou_google">
          <option value="">Usar padrão (raiz)</option>
          {% for ou in ous_google %}
          <option value="{{ ou.caminho }}" {{ 'selected' if form and form.ou_google == ou.caminho }}>{{ ou.caminho }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-footer">
      <button type="submit" class="btn btn-primario" id="btn-criar-acesso">Criar acesso</button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  const dominioGoogle = "{{ dominio_google }}";
  let toastBuscaCpf = null;
  let toastEmail = null;

  document.getElementById('btn-buscar-cpf').addEventListener('click', buscarCpf);

  async function buscarCpf() {
    const cpf = document.getElementById('cpf').value.trim();
    if (!cpf) { return; }

    if (toastBuscaCpf) toastBuscaCpf.remove();
    toastBuscaCpf = mostrarToast('Buscando no Tangerino…', 'info');

    try {
      const resposta = await fetch(`{{ url_for('painel.api_buscar_colaborador_cpf') }}?cpf=${encodeURIComponent(cpf)}`);
      const dados = await resposta.json();
      toastBuscaCpf.remove();

      if (!resposta.ok) {
        toastBuscaCpf = mostrarToast(dados.erro || 'Falha ao buscar no Tangerino.', 'erro');
        return;
      }

      document.getElementById('nome_completo').value = dados.nome || '';
      document.getElementById('matricula').value = dados.matricula || '';
      document.getElementById('telefone').value = dados.telefone || '';
      document.getElementById('data_nascimento').value = dados.data_nascimento || '';
      document.getElementById('setor').value = dados.setor || '';
      document.getElementById('cargo').value = dados.cargo || '';
      document.getElementById('email_pessoal').value = dados.email_pessoal || '';

      const setorOriginal = document.getElementById('setor-original');
      setorOriginal.textContent = `Original do Tangerino: ${dados.setor || '—'}`;
      setorOriginal.style.display = 'block';

      const cargoOriginal = document.getElementById('cargo-original');
      cargoOriginal.textContent = `Original do Tangerino: ${dados.cargo || '—'}`;
      cargoOriginal.style.display = 'block';

      const login = dados.login_sugerido || '';
      document.getElementById('username').value = login;
      document.getElementById('email').value = login && dominioGoogle ? `${login}@${dominioGoogle}` : '';

      const botaoCriar = document.getElementById('btn-criar-acesso');
      if (dados.ad_existente) {
        toastBuscaCpf = mostrarToast(
          `Esse colaborador já tem usuário no AD: ${dados.ad_existente.sam}` +
          (dados.ad_existente.mail ? ` (${dados.ad_existente.mail})` : '') + '. Criação bloqueada.',
          'erro'
        );
        botaoCriar.disabled = true;
        return;
      }

      toastBuscaCpf = mostrarToast('Dados encontrados no Tangerino. Nenhum usuário existente no AD para esse CPF/login.', 'sucesso');
      setTimeout(() => { if (toastBuscaCpf) { toastBuscaCpf.remove(); toastBuscaCpf = null; } }, 4000);
      botaoCriar.disabled = false;

      if (document.getElementById('email').value) verificarEmail();
    } catch (e) {
      if (toastBuscaCpf) toastBuscaCpf.remove();
      toastBuscaCpf = mostrarToast('Falha ao buscar no Tangerino.', 'erro');
    }
  }

  document.getElementById('email').addEventListener('blur', verificarEmail);

  async function verificarEmail() {
    const email = document.getElementById('email').value.trim();
    const botaoCriar = document.getElementById('btn-criar-acesso');
    if (!email) { return; }

    if (toastEmail) toastEmail.remove();
    toastEmail = mostrarToast('Verificando disponibilidade no Google Workspace…', 'info');

    try {
      const resposta = await fetch(`{{ url_for('painel.api_verificar_email_google') }}?email=${encodeURIComponent(email)}`);
      const dados = await resposta.json();
      toastEmail.remove();

      if (!resposta.ok) {
        toastEmail = mostrarToast(dados.erro || 'Falha ao verificar o email.', 'erro');
        return;
      }

      if (dados.existe) {
        toastEmail = mostrarToast('Já existe uma conta com esse email no Google Workspace.', 'erro');
        botaoCriar.disabled = true;
      } else {
        toastEmail = mostrarToast('Email disponível.', 'sucesso');
        setTimeout(() => { if (toastEmail) { toastEmail.remove(); toastEmail = null; } }, 3000);
        botaoCriar.disabled = false;
      }
    } catch (e) {
      if (toastEmail) toastEmail.remove();
      toastEmail = null;
    }
  }
</script>
{% endblock %}
