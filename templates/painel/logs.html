{% extends "base.html" %}
{% block titulo %}Logs{% endblock %}

{% block conteudo %}
<div class="page-header">
  <h1>Logs do sistema</h1>
  <p>Últimas linhas dos arquivos de log, atualizado automaticamente.</p>
</div>

<div class="card-panel">
  <div class="log-toolbar">
    <select id="seletor-log">
      <option value="geral">Log geral (integracao_solides.log)</option>
      <option value="webhooks">Log de webhooks (webhooks.log)</option>
    </select>
    <span class="status-auto" id="status-auto">atualizando a cada 5s</span>
  </div>
  <div class="log-viewer" id="log-viewer">Carregando...</div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const visualizador = document.getElementById('log-viewer');
  const seletor = document.getElementById('seletor-log');

  function formatarLinha(linha) {
    const escapada = linha.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    if (/\bERROR\b/.test(linha)) return `<div class="linha-erro">${escapada}</div>`;
    if (/\bWARNING\b|\[AVISO\]/.test(linha)) return `<div class="linha-aviso">${escapada}</div>`;
    if (/\[OK\]/.test(linha)) return `<div class="linha-ok">${escapada}</div>`;
    return `<div>${escapada}</div>`;
  }

  async function carregarLogs() {
    try {
      const resposta = await fetch(`{{ url_for('painel.api_logs') }}?arquivo=${seletor.value}`);
      const dados = await resposta.json();
      const rolarParaFinal = visualizador.scrollTop + visualizador.clientHeight >= visualizador.scrollHeight - 20;

      if (!dados.linhas || dados.linhas.length === 0) {
        visualizador.innerHTML = '<div style="color:#8b93a3;">Nenhuma linha de log ainda.</div>';
        return;
      }
      visualizador.innerHTML = dados.linhas.map(formatarLinha).join('');
      if (rolarParaFinal) visualizador.scrollTop = visualizador.scrollHeight;
    } catch (e) {
      visualizador.innerHTML = '<div style="color:#ff8a8a;">Falha ao carregar os logs.</div>';
    }
  }

  seletor.addEventListener('change', carregarLogs);
  carregarLogs();
  visualizador.scrollTop = visualizador.scrollHeight;
  setInterval(carregarLogs, 5000);
</script>
{% endblock %}
